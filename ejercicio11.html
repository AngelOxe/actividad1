<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Kilómetros a Millas</title>
    <link rel="stylesheet" href="css/style11.css">
</head>
<body>
    <div class="calculator-container">
        <h2>Conversor de Kilómetros a Millas</h2>
        
        <div class="input-group">
            <label for="kilometros">Distancia en Kilómetros (km):</label>
            <input type="number" id="kilometros" placeholder="Ej. 10" step="any">
        </div>
        
        <button id="convertBtn">Convertir</button>
        
        <div class="input-group">
            <label for="millas">Distancia en Millas (mi):</label>
            <!-- Propiedad readonly para bloquear la edición manual -->
            <input type="text" id="millas" readonly placeholder="Resultado">
        </div>
        
        <p id="error-message" class="error"></p>
    </div>

    <script src="js/script11.js"></script>
</body>
</html>
